# route_patrol.yaml —— 《巡考机器人.md》巡考/巡更示例路线
#
# 字段说明：
#   forward / back : 米（+前进 / -后退），走 linear.x
#   turn           : 度（+左转/逆时针，-右转/顺时针），走 angular.z
#   strafe         : 米（+左 / -右），走 linear.y，仅麦轮/全向轮车型支持，差速车请删除该行
#   checkpoint     : 点位停留秒数 -> 打卡留痕并写入巡更记录（也可写 checkpoint: true 只打卡不停留）
#   wait / stop    : 原地等待秒数
#   speed          : 可选，单独指定该步速度
#   name           : 动作/点位名称，会写进巡更记录
#
# 下面这条路线按"考点公共区域"编排：一楼楼道 -> 连廊 -> 保密室门口 -> 机房门口 -> 原路返回。
# 现场务必按实际墙角与门距重新标定数值，并先用 --speed 0.15 慢速试跑。

route_name: "考点夜间巡更 A 线（楼道-连廊-保密室）"
default_speed: 0.20        # m/s   直行/横移速度
default_turn_speed: 0.60   # rad/s 转向速度

steps:
  # --- 一楼楼道：从待机点出发，沿走廊直行，东端右转进连廊 ---
  - {forward: 3.00, name: "一楼楼道东段直行"}
  - {turn: -90, name: "东端右转进连廊"}
  - {forward: 2.00, name: "连廊直行"}

  # --- 保密室门口：停留 8s，云台预置位巡航 + 打卡留痕 ---
  - {checkpoint: 8.0, name: "试卷保密室门口"}

  # --- 机房门口：慢速靠近并停留，检测温湿度/烟雾异常 ---
  - {forward: 1.50, speed: 0.12, name: "慢速靠近机房门口"}
  - {checkpoint: 5.0, name: "机房门口环境巡检"}

  # --- 连廊尽头调头，原路返回待机点 ---
  - {turn: 180, name: "连廊尽头调头"}
  - {forward: 1.50, speed: 0.12, name: "返程（机房段）"}
  - {forward: 2.00, name: "返程（连廊）"}
  - {turn: 90, name: "回到一楼楼道"}
  - {forward: 3.00, name: "返回待机点"}
  - {wait: 2.0, name: "待机点整备"}

# 麦轮/全向轮车型如需侧向让位，可加：
#  - {strafe: 0.50, name: "横移让位"}
